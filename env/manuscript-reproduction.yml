name: chronopack-manuscript
channels:
  - conda-forge
  - bioconda
  # The historical wot2 environment used defaults/pkgs-main packages for
  # version-sensitive pins such as scipy=1.15.3.
  - defaults
dependencies:
  - python=3.13.2
  - pip

  # Historical Python/WOT runtime components recovered from wot2.
  - numpy=2.2.6
  - pandas=2.2.3
  - scipy=1.15.3
  - statsmodels=0.14.4
  - matplotlib
  - seaborn
  - h5py
  - numba
  - pynndescent
  - umap-learn
  - pot

  # Current ChronoPack package/test/runtime utilities.
  - pytest
  - hatchling
  - ipykernel
  - networkx=3.4.2
  - rpy2
  - gseapy

  # R / Bioconductor backend aligned with historical tradeSeq regression.
  - r-base=4.4.3
  - bioconductor-tradeseq=1.20.0
  - bioconductor-singlecellexperiment=1.28.0
  - bioconductor-biocparallel=1.40.0
  - bioconductor-summarizedexperiment=1.36.0
  - bioconductor-s4vectors=0.44.0
  - bioconductor-iranges=2.40.0
  - bioconductor-biocgenerics=0.52.0
  - bioconductor-genomicranges=1.58.0
  - bioconductor-delayedarray=0.32.0
  - bioconductor-slingshot=2.14.0
  - r-mgcv=1.9_3
  - r-mclust=6.1.3
  - r-ggplot2=4.0.0
  - r-cluster=2.1.8.1
  - r-matrix=1.7_4
  - r-mass=7.3_65
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-tibble=3.3.0
  - r-stringr=1.5.2
  - r-rcpp=1.1.0
  - r-fdrtool
  - r-circlize
  - r-viridis
  - r-patchwork
  - r-matrixstats
  - r-rcolorbrewer
  - r-ggrepel
  - r-shadowtext
  - r-purrr
  - r-scales

  # Resolver-consistent WOT/Scanpy stack. Apply
  # env/manuscript-pip-overrides.txt with `pip install --no-deps -r` after
  # creating the environment to reproduce the metadata-inconsistent imported
  # graph/scikit-learn versions observed in wot2.
  - pip:
      - scanpy==1.11.1
      - anndata==0.11.4
      - scikit-image==0.25.2
      - networkx==3.4.2
      - wot==1.0.8.post2
