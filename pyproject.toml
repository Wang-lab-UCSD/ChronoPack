[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chronopack"
version = "0.1.0"
description = "Time-resolved single-cell analysis workflows with Python APIs and R statistical backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "ChronoPack developers" }
]
dependencies = [
  "anndata",
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
]

[project.optional-dependencies]
scanpy = [
  "scanpy",
]
r = [
  "rpy2",
]
test = [
  "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chronopack"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.build]
include = [
  "src/chronopack/_backends/r/*.R",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
