[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chronopack"
dynamic = ["version"]
description = "Time-resolved single-cell analysis workflows with Python APIs and R statistical backends."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "ChronoPack developers" }
]
dependencies = [
    "anndata",
    "numpy",
    "pandas",
    "scanpy",
    "scipy",
    "scikit-learn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Wang-lab-UCSD/ChronoPack"
Repository = "https://github.com/Wang-lab-UCSD/ChronoPack"
Documentation = "https://github.com/Wang-lab-UCSD/ChronoPack/tree/main/docs"

[project.optional-dependencies]
scanpy = [
  "scanpy",
]
wot = [
  "igraph",
  "leidenalg",
  "scanpy",
  "wot==1.0.8.post2",
]
grn = [
  "networkx",
  "omnipath",
]
c2c = [
  "matplotlib",
  "scanpy",
  "statsmodels",
]
r = [
  "rpy2",
]
test = [
  "networkx",
  "pytest",
]
dev = [
  "build",
  "hatchling",
  "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chronopack"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/env/environment.yml",
  "/env/conda-linux-64.lock",
  "/env/pip-freeze.txt",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.hatch.version]
path = "src/chronopack/__init__.py"

[tool.hatch.build]
include = [
  "src/chronopack/_backends/r/*.R",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
